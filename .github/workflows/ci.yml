name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify generated dependency files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Formatting
        run: test -z "$(gofmt -l cmd contracts internal tests)"
      - name: Vet
        run: go vet ./...
      - name: Unit and architecture tests
        run: go test ./...
      - name: Authoring and runtime contract repeatability
        run: go test -count=20 ./contracts/ir ./contracts/dsl ./contracts/source-map ./internal/ir ./internal/catalog ./internal/dsl ./internal/sourcemap ./internal/compiler
      - name: Bounded IR fuzzing
        run: |
          go test ./internal/ir -run='^$' -fuzz=FuzzParser -fuzztime=5s
          go test ./internal/ir -run='^$' -fuzz=FuzzLogicalID -fuzztime=5s
      - name: Race detector
        run: go test -race ./...
      - name: Build four executables
        run: |
          go build ./cmd/evalfrog
          go build ./cmd/control-plane
          go build ./cmd/worker-builtin
          go build ./cmd/worker-sandbox
      - name: Validate all configuration profiles
        run: |
          go run ./cmd/evalfrog config validate --profile local --config-dir configs
          go run ./cmd/evalfrog config validate --profile test --config-dir configs
          go run ./cmd/evalfrog config validate --profile production-default --config-dir configs

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate Compose model
        run: docker compose -f deployments/compose.yaml config --quiet
      - name: Start M0 stack
        run: docker compose -f deployments/compose.yaml up -d --build --wait
      - name: CLI doctor
        run: docker compose -f deployments/compose.yaml run --build --rm --no-deps evalfrog-cli doctor --profile local --config-dir /app/configs
      - name: Dependency and migration integration tests
        run: go test -tags=integration ./tests/integration
      - name: Stop M0 stack
        if: always()
        run: docker compose -f deployments/compose.yaml down -v --remove-orphans
