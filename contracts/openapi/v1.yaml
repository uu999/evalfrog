openapi: 3.1.0
info:
  title: EvalFrog External API
  version: 1.0.0-m11
  description: Human Web and Agent CLI share this complete authoring and runtime command API.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /v1/projects/{project_id}/workflows:
    post:
      operationId: createWorkflow
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkflowRequest' }
      responses:
        '201': { $ref: '#/components/responses/WorkflowCreated' }
        default: { $ref: '#/components/responses/Error' }
  '/v1/projects/{project_id}/workflows:copy':
    post:
      operationId: copyPublishedVersion
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CopyWorkflowRequest' }
      responses:
        '201': { $ref: '#/components/responses/WorkflowCreated' }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/workflows/{workflow_id}:
    get:
      operationId: getWorkflow
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/WorkflowID'
      responses:
        '200':
          description: Project-scoped Workflow metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/workflows/{workflow_id}/draft:
    get:
      operationId: getDraft
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/WorkflowID'
      responses:
        '200':
          description: Current Draft pointer and immutable revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: saveDraft
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/WorkflowID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveDraftRequest' }
      responses:
        '201':
          description: Newly created immutable Draft Revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftRevision' }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/workflows/{workflow_id}/draft/validate:
    post:
      operationId: validateDraft
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/WorkflowID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevisionRequest' }
      responses:
        '200':
          description: Stable ordered diagnostics; valid can be false.
          content:
            application/json:
              schema:
                type: object
                required: [valid, diagnostics]
                additionalProperties: false
                properties:
                  valid: { type: boolean }
                  diagnostics: { type: array, items: { type: object } }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/workflows/{workflow_id}/draft/test:
    post:
      operationId: testDraft
      description: Server validates and compiles the selected immutable Draft Revision, then creates a Test Run bound to the resulting Snapshot.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/WorkflowID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestDraftRequest' }
      responses:
        '201':
          description: Persisted Test Run. The immutable Snapshot remains server-owned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunRecord' }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/workflows/{workflow_id}/publish:
    post:
      operationId: publishWorkflow
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/WorkflowID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRequest' }
      responses:
        '201':
          description: New immutable Version, automatically activated.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                additionalProperties: false
                properties:
                  version: { $ref: '#/components/schemas/PublishedVersion' }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/workflows/{workflow_id}/versions/{version_number}/activate:
    post:
      operationId: rollbackWorkflow
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/WorkflowID'
        - name: version_number
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Historical immutable Version selected as Active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishedVersion' }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/workflows/{workflow_id}/runs:
    post:
      operationId: createProductionRun
      description: Creates a Run from the active immutable Published Version only.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/WorkflowID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRunRequest' }
      responses:
        '201':
          description: Persisted Production Run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunRecord' }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/runs/{run_id}:
    get:
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Current PostgreSQL-derived Run Read Model.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunView' }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/runs/{run_id}/diagnostics:
    get:
      operationId: getRunDiagnostics
      description: Safe operational metadata only; inputs, outputs, lease tokens and executor logs are excluded.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Current Run, Attempt and safe Audit diagnostics derived from PostgreSQL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDiagnostics' }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/runs/{run_id}/events:
    get:
      operationId: subscribeRunUpdates
      description: Lossy Server-Sent Event wake-up stream. Consumers must re-read the Run view after every update or reconnect.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Run update wake-up events only; no Runtime state is carried in the stream.
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/RunID'
      responses:
        '202': { $ref: '#/components/responses/CancelAccepted' }
        '200': { $ref: '#/components/responses/CancelAccepted' }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/runs/{run_id}/replay:
    post:
      operationId: replayRunWakeup
      description: Project administrators may re-emit a current Runtime wake-up. Arbitrary Kafka payload injection is not supported.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplayRunRequest' }
      responses:
        '202': { $ref: '#/components/responses/ReplayAccepted' }
        '200': { $ref: '#/components/responses/ReplayAccepted' }
        default: { $ref: '#/components/responses/Error' }
  /v1/node-types:
    get:
      operationId: listNodeTypes
      responses:
        '200':
          description: Public, versionless authoring descriptions from the current catalog.
          content:
            application/json:
              schema:
                type: object
                required: [node_types]
                properties:
                  node_types:
                    type: array
                    items: { $ref: '#/components/schemas/NodeDescription' }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/connections:
    get:
      operationId: listConnections
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: Safe authoring metadata; endpoints and secret references are absent.
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections:
                    type: array
                    items: { $ref: '#/components/schemas/ConnectionSummary' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ProjectID:
      name: project_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkflowID:
      name: workflow_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunID:
      name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
  schemas:
    IRDocument:
      type: object
      description: Must conform to contracts/ir/v1/schema.json.
    CreateWorkflowRequest:
      type: object
      required: [name, ir]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        ir: { $ref: '#/components/schemas/IRDocument' }
    SaveDraftRequest:
      type: object
      required: [expected_revision, ir]
      additionalProperties: false
      properties:
        expected_revision: { type: integer, format: int64, minimum: 1 }
        ir: { $ref: '#/components/schemas/IRDocument' }
    RevisionRequest:
      type: object
      required: [revision]
      additionalProperties: false
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
    TestDraftRequest:
      type: object
      required: [revision, input, deadline_at]
      additionalProperties: false
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        input: { type: object }
        deadline_at: { type: string, format: date-time }
    CreateRunRequest:
      type: object
      required: [input, deadline_at]
      additionalProperties: false
      properties:
        input: { type: object }
        deadline_at: { type: string, format: date-time }
    PublishRequest:
      type: object
      required: [expected_revision, change_log]
      additionalProperties: false
      properties:
        expected_revision: { type: integer, format: int64, minimum: 1 }
        change_log: { type: string, maxLength: 4000 }
    CopyWorkflowRequest:
      type: object
      required: [source_workflow_id, source_version_number, name]
      additionalProperties: false
      properties:
        source_workflow_id: { type: string, format: uuid }
        source_version_number: { type: integer, format: int64, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 200 }
    Workflow:
      type: object
      required: [workflow_id, project_id, name, created_by, created_at, updated_at]
      properties:
        workflow_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        active_version_id: { type: [string, 'null'], format: uuid }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DraftRevision:
      type: object
      required: [draft_revision_id, project_id, workflow_id, revision_number, ir, catalog_revision, created_by, created_at]
      properties:
        draft_revision_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        workflow_id: { type: string, format: uuid }
        revision_number: { type: integer, format: int64 }
        ir: { $ref: '#/components/schemas/IRDocument' }
        catalog_revision: { type: string }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        cloned_from_version_id: { type: [string, 'null'], format: uuid }
    Draft:
      type: object
      required: [project_id, workflow_id, current_revision, state_version, current]
      properties:
        project_id: { type: string, format: uuid }
        workflow_id: { type: string, format: uuid }
        current_revision: { type: integer, format: int64 }
        state_version: { type: integer, format: int64 }
        current: { $ref: '#/components/schemas/DraftRevision' }
    PublishedVersion:
      type: object
      required: [version_id, project_id, workflow_id, version_number, source_draft_revision_id, execution_snapshot_id, change_log, created_by, created_at]
      properties:
        version_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        workflow_id: { type: string, format: uuid }
        version_number: { type: integer, format: int64 }
        source_draft_revision_id: { type: string, format: uuid }
        execution_snapshot_id: { type: string, format: uuid }
        change_log: { type: string }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    RunRecord:
      type: object
      description: Minimal command response. Read current Runtime state through the Run View endpoint.
      required: [run_id, purpose, state, created_at]
      properties:
        run_id: { type: string, format: uuid }
        purpose: { type: string, enum: [test, production] }
        created_at: { type: string, format: date-time }
        state: { type: string, enum: [pending, running, succeeded, failed, canceled, timed_out] }
    FailureLocation:
      type: object
      properties:
        logical_node_id: { type: string }
        logical_edge_id: { type: string }
        ir_field: { type: string }
        details: { type: object }
    RunNodeView:
      type: object
      required: [execution_node_id, state, activated]
      properties:
        execution_node_id: { type: string }
        state: { type: string }
        activated: { type: boolean }
        attempt_id: { type: string, format: uuid }
        failure: { type: object }
        location: { $ref: '#/components/schemas/FailureLocation' }
    RunView:
      type: object
      required: [run_id, project_id, workflow_id, purpose, state, state_version, snapshot_id, deadline_at, created_at, updated_at, cancel_requested, nodes]
      properties:
        run_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        workflow_id: { type: string, format: uuid }
        purpose: { type: string, enum: [test, production] }
        state: { type: string }
        state_version: { type: integer, minimum: 1 }
        snapshot_id: { type: string, format: uuid }
        deadline_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        cancel_requested: { type: boolean }
        output: { type: object }
        failure: { type: object }
        failure_location: { $ref: '#/components/schemas/FailureLocation' }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/RunNodeView' }
    AttemptDiagnostic:
      type: object
      required: [attempt_id, execution_node_id, sequence, kind, state, created_at, updated_at]
      properties:
        attempt_id: { type: string, format: uuid }
        execution_node_id: { type: string }
        sequence: { type: integer, minimum: 1 }
        kind: { type: string, enum: [business, recovery] }
        state: { type: string }
        lease_owner: { type: string }
        lease_expires_at: { type: string, format: date-time }
        error_code: { type: string }
        dsl_field: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AuditDiagnostic:
      type: object
      required: [action, actor_type, actor_id, trace_id, details, created_at]
      properties:
        action: { type: string }
        actor_type: { type: string, enum: [principal, system] }
        actor_id: { type: string }
        trace_id: { type: string }
        details: { type: object }
        created_at: { type: string, format: date-time }
    RunDiagnostics:
      type: object
      required: [run, attempts, audit]
      properties:
        run: { $ref: '#/components/schemas/RunView' }
        attempts:
          type: array
          items: { $ref: '#/components/schemas/AttemptDiagnostic' }
        audit:
          type: array
          items: { $ref: '#/components/schemas/AuditDiagnostic' }
    ReplayRunRequest:
      type: object
      required: [event_type, aggregate_id]
      additionalProperties: false
      properties:
        event_type:
          type: string
          enum: [run.created, run.cancel_requested, attempt.completed, attempt.lost, retry.due, run.deadline_reached]
        aggregate_id: { type: string, format: uuid }
    ConnectionSummary:
      type: object
      required: [connection_id, reference, enabled, resource_revision]
      properties:
        connection_id: { type: string, format: uuid }
        reference: { type: string }
        enabled: { type: boolean }
        resource_revision: { type: integer, minimum: 1 }
    NodeDescription:
      type: object
      required: [type, kind, natural_language_description, allowed_inputs, outputs, examples]
      properties:
        type: { type: string }
        kind: { type: string, enum: [control, task] }
        natural_language_description: { type: string }
        allowed_inputs: { type: array, items: { type: object } }
        additional_inputs: { type: [object, 'null'] }
        outputs: { type: object }
        examples: { type: array, items: { type: object } }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable, request_id, trace_id]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
            request_id: { type: string }
            trace_id: { type: string }
            details: { type: [object, 'null'] }
  responses:
    WorkflowCreated:
      description: Workflow and immutable Draft Revision 1.
      content:
        application/json:
          schema:
            type: object
            required: [workflow, draft_revision]
            additionalProperties: false
            properties:
              workflow: { $ref: '#/components/schemas/Workflow' }
              draft_revision: { $ref: '#/components/schemas/DraftRevision' }
    CancelAccepted:
      description: Cancellation accepted or already observed; Engine completes the state transition asynchronously.
      content:
        application/json:
          schema:
            type: object
            required: [run, accepted]
            properties:
              run: { $ref: '#/components/schemas/RunRecord' }
              accepted: { type: boolean }
    ReplayAccepted:
      description: Replay accepted or no longer actionable. A successful request emits a durable Runtime Outbox wake-up and Audit fact.
      content:
        application/json:
          schema:
            type: object
            required: [accepted]
            additionalProperties: false
            properties:
              accepted: { type: boolean }
    Error:
      description: Stable machine-readable error envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
